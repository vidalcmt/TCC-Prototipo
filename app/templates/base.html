<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Protótipo TCC{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 16px; color: #1f2328; }
    nav a { margin-right: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border-bottom: 1px solid #d0d7de; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #f6f8fa; }
    .falha { color: #b42318; }
    .discreto { color: #59636e; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Início</a>
    <a href="/metricas">Métricas</a>
  </nav>
  <main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
